[package]
name = "loops-desktop"
version = "0.1.0"
description = "Loops Desktop — a hotkey-driven command bar for browsing, creating, and injecting reusable AI assets (loops, prompts, context…) into other AI apps."
authors = ["loops-desktop"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows linker
# limitation, see https://github.com/rust-lang/cargo/issues/8519).
name = "loops_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt"] }
rfd = "0.15"

# Windows-only: foreground-window/process inspection for per-app scope filtering.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }
